name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest ruff mypy build tomli
      - run: python -m pip install -e .
      - run: python -m ruff check .
      - run: python -m mypy python
      - name: Build native library for testing
        run: |
          cmake -S . -B build/native -DZENTHRIX_BUILD_TESTS=OFF
          cmake --build build/native
      - run: python -m pytest
      - run: python -m build

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native monorepo
        run: |
          cmake -S . -B build/native -DZENTHRIX_BUILD_TESTS=ON
      - name: Build native monorepo
        run: |
          cmake --build build/native
      - name: Test native monorepo
        run: ctest --test-dir build/native --output-on-failure

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest ruff mypy
      - run: python -m pip install -e benchmarks
      - working-directory: benchmarks
        run: |
          python -m ruff check .
          python -m mypy python
          python -m pytest
          zbench validate examples/results.json

  deploy:
    needs: [test, native, benchmarks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/azureuser/zenthrix
            git pull --ff-only origin main
            cmake -S . -B build/native -DZENTHRIX_BUILD_TESTS=ON
            cmake --build build/native -j2
            ctest --test-dir build/native --output-on-failure
            .venv/bin/pytest -q
            if command -v pm2 >/dev/null 2>&1; then
              pm2 reload nexus-ml || true
            fi
